[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fwen"
version = "0.1.0"
description = "Flutter Clean Architecture scaffolder - Create production-ready Flutter apps with Clean Architecture in seconds"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "calvingit", email = "calvingit@users.noreply.github.com" }
]
keywords = ["flutter", "clean-architecture", "scaffolder", "cli", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "questionary>=2.0.0",
    "rich>=14.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
fwen = "fwen.__main__:main"

[project.urls]
Homepage = "https://github.com/calvingit/fwen"
Documentation = "https://github.com/calvingit/fwen#readme"
Repository = "https://github.com/calvingit/fwen"
"Bug Tracker" = "https://github.com/calvingit/fwen/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/fwen --cov-report=term-missing"

[tool.coverage.run]
source = ["src/fwen"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/templates",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fwen"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"
"scripts" = "scripts"
