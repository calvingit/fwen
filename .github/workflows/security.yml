name: Security

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true
